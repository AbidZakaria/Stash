# Builds the Android APK on GitHub's machines and publishes it as a Release.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Same key every build, so new versions install as updates and keep your data.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 repository secret first (see README)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/pocketstash.keystore

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Collect web files
        run: |
          mkdir -p www
          cp -r index.html styles.css app.js manifest.webmanifest sw.js icons www/

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#2a78d6' --iconBackgroundColorDark '#2a78d6' \
            --splashBackgroundColor '#f6f5f2' --splashBackgroundColorDark '#121211' \
            || echo "::warning::Icon generation failed; using the default icon."
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android.signingConfigs.debug.storeFile = file("${System.getenv('HOME')}/.android/pocketstash.keystore")
          android.signingConfigs.debug.storePassword = 'android'
          android.signingConfigs.debug.keyAlias = 'androiddebugkey'
          android.signingConfigs.debug.keyPassword = 'android'
          GRADLE

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PocketStash-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PocketStash-apk
          path: PocketStash-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PocketStash build ${{ github.run_number }}
          files: PocketStash-*.apk
          body: Open this page on your phone, tap the .apk to download, then open it to install or update.
